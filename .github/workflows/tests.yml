# Every push: the unit tests, and a syntax check of the web app's code.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in cloud/web/js/*.js; do node --check "$f"; done
